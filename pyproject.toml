[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lemgendary-env-manager"
version = "16.9.49"
description = "Centralized environment and dependency manager for LemGendary projects"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "pip-tools>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "packaging>=23.0",
    "python-multipart>=0.0.33"
]

[project.scripts]
lem-env = "env_manager.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["env_manager*"]

# ecosystem/ecosystem.json (the single source of ecosystem facts) and its
# schema ship with the wheel; env_manager.ecosystem falls back to this copy.
[tool.setuptools.data-files]
"share/lemgendary-env-manager/ecosystem" = [
    "ecosystem/ecosystem.json",
    "ecosystem/ecosystem.schema.json",
]

[tool.pyright]
include = ["env_manager", "tests"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (Python 3.12 modern idioms)
    "PL",  # Pylint parity rules (PLC, PLE, PLR, PLW)
    "RUF", # Ruff-specific clean code checks
]
