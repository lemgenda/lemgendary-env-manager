[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lemgendary-env-manager"
version = "16.2.0"
description = "Centralized environment and dependency manager for LemGendary projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "pip-tools>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "packaging>=23.0"
]

[project.scripts]
lem-env = "env_manager.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["env_manager*"]

[tool.pyright]
include = ["env_manager"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportPrivateImportUsage = "none"
reportGeneralTypeIssues = "none"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade (Python 3.12 modern idioms)
    "PL",  # Pylint parity rules (PLC, PLE, PLR, PLW)
    "RUF", # Ruff-specific clean code checks
]
ignore = [
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
]
